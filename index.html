<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Paper Citadel - 종이성채</title>
    <link rel="stylesheet" href="style.css?v=20260608-startpanel-3">
  </head>
  <body>
    <main class="shell">
      <canvas id="game" width="1280" height="720" aria-label="Paper Citadel 종이성채 게임 화면"></canvas>
      <div class="help">
        <span>WASD 이동</span>
        <span>마우스 / 방향키 시점</span>
        <span>좌클릭 공격 / 스페이스 점프</span>
        <span>우클릭 특수공격</span>
      </div>
      <form id="name-screen" class="name-screen" autocomplete="off">
        <div class="start-board">
          <div class="game-box">
            <div class="name-panel">
              <label for="character-name">캐릭터명</label>
              <div class="name-row">
                <input id="character-name" maxlength="18" placeholder="이름 입력" required>
                <button type="submit">입장</button>
              </div>
              <p id="name-status">같은 이름으로 이어서 시작합니다.</p>
            </div>
          </div>
        </div>
      </form>
    </main>
    <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
    <script src="game.js?v=20260611-black-ceiling-floor-1"></script>
  </body>
</html>
